apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-demo-app
  labels:
    app: devops-demo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-demo-app
  template:
    metadata:
      labels:
        app: devops-demo-app
    spec:
      containers:
        - name: devops-demo-app
          image: REPLACE_IMAGE
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: app-db-config
            # - secretRef:
            #     name: app-db-secret

          env:
            - name: DB_USER
              value: "dbadmin"
            - name: DB_PASSWORD
              value: "Db1!ae365478606443fcb185"

          command: ["sh", "-c"]
          args:
            - >-
              PGPASSWORD="$DB_PASSWORD" PGSSLMODE=require
              psql -v ON_ERROR_STOP=1
              -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME"
              -f /sql/init.sql
          volumeMounts:
            - name: sql
              mountPath: /sqll

          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"

      volumes:
        - name: sql
          configMap:
            name: db-init-sq