name: CI-CD Pipeline (Test, Build, Trivy, ECR, EKS)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build, Scan, Push to ECR & Deploy to EKS
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository code
        uses: actions/checkout@v4

      - name: 2. Configure AWS credentials from GitHub Secrets
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: 3. Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 4. Build and tag Docker image (runs tests inside Dockerfile)
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --no-cache -f ./app/Dockerfile -t "$REGISTRY/$REPOSITORY:$IMAGE_TAG" ./app
          docker tag "$REGISTRY/$REPOSITORY:$IMAGE_TAG" "$REGISTRY/$REPOSITORY:latest"

      - name: 5. Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL"

      - name: 6. Push Docker image to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$REPOSITORY:latest"

      - name: 7. Connect kubectl to Amazon EKS
        run: |
          aws eks update-kubeconfig --name "${{ secrets.EKS_CLUSTER_NAME }}" --region "${{ secrets.AWS_REGION }}"


      - name: Create or update DB secret
        run: |
          kubectl create secret generic app-db-secret \
            --from-literal=DB_USER="${{ secrets.DB_USER }}" \
            --from-literal=DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -
            
      - name: 8. Deploy to Amazon EKS and verify rollout
        env:
          IMAGE_URI: "${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}"
        run: |
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/service.yaml
          sed -i "s|REPLACE_IMAGE|$IMAGE_URI|g" k8s/deployment.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl set image deployment/devops-demo-app devops-demo-app="$IMAGE_URI"
          kubectl rollout status deployment/devops-demo-app --timeout=3m

      - name: Show app diagnostics
        if: always()
        run: |
          echo "=== Image running ==="
          kubectl get deployment devops-demo-app -o jsonpath='{.spec.template.spec.containers[0].image}'; echo
          echo "=== Pods ==="
          kubectl get pods -l app=devops-demo-app -o wide
          echo "=== App logs ==="
          kubectl logs -l app=devops-demo-app --tail=100 --prefix || true
          echo "=== Env (no secrets) ==="
          kubectl exec deploy/devops-demo-app -- node -e 'console.log({ host: process.env.DB_HOST, port: process.env.DB_PORT, db: process.env.DB_NAME, userSet: Boolean(process.env.DB_USER), passLen: (process.env.DB_PASSWORD || "").length })'
          kubectl get secret app-db-secret -o jsonpath='{.data.DB_USER}' | base64 -d | wc -c
          kubectl get secret app-db-secret -o jsonpath='{.data.DB_PASSWORD}' | base64 -d | wc -c